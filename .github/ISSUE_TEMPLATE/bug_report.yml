name: "Bug Report"
description: "File an issue or bug regarding the compiler scripts or installation package"
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please report compiler or installation issues here. If you are reporting hardware camera compatibility results for a specific device, please use the **Device Compatibility Report** instead.

  - type: dropdown
    id: compiler_script
    attributes:
      label: Operating System & Script Used
      options:
        - "Linux (compile_recovery_package_linux.sh)"
        - "Windows PowerShell (compile_recovery_package_windows.ps1)"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description of the Bug
      description: "A clear and concise description of what happened."
    validations:
      required: true

  - type: textarea
    id: steps_to_reproduce
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Run './compile_recovery_package_linux.sh /path/to/firmware'
        2. Sideload generated zip via Recovery
        3. See error ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Terminal or Log Output
      placeholder: "Paste console output or error traces here."
    validations:
      required: false
