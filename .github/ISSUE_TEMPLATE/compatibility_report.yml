        - "moto g 5G (kiev)"
        - "moto g 5G - 2024 (fogo)"
        - "moto g 5G plus (nairo)"
        - "moto g LTE (2014) (thea)"
        - "moto g play (2021) (guamna)"
        - "moto g power 2021 (borneo)"
        - "moto g pure (ellis)"
        - "moto g stylus 5G (denver)"
        - "moto g stylus 5G (2022) (milanf)"
        - "moto g stylus 5G (2023) (genevn)"
        - "moto g05 (lamu)"
        - "moto g10 (capri)"
        - "moto g10 power (capri)"
        - "moto g100 (nio)"
        - "moto g15 (lamu)"
        - "moto g15 power (lamu)"
        - "moto g200 5G (xpeng)"
        - "moto g3 turbo (merlin)"
        - "moto g30 (caprip)"
        - "moto g32 (devon)"
        - "moto g34 5G (fogos)"
        - "moto g4 (athene)"
        - "moto g4 play (harpia)"
        - "moto g42 (hawao)"
        - "moto g45 5G (fogos)"
        - "moto g5 (cedric)"
        - "moto g50 (ibiza)"
        - "moto g52 (rhode)"
        - "moto g5s (montana)"
        - "moto g6 plus (evert)"
        - "moto g7 (river)"
        - "moto g7 play (channel)"
        - "moto g7 plus (lake)"
        - "moto g7 power (ocean)"
        - "moto g82 5G (rhodep)"
        - "moto g84 5G (bangkk)"
