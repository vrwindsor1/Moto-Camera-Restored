name: "Import Compatibility Report"

on:
  issues:
    types: [opened, edited, labeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  import-report:
    # Trigger if title starts with [Compatibility] or instruction prefix, body contains report headers, or has compatibility/import-report label
    if: >-
      startsWith(github.event.issue.title, '[Compatibility]') ||
      startsWith(github.event.issue.title, 'Please DO NOT edit the title') ||
      contains(github.event.issue.labels.*.name, 'compatibility') ||
      (github.event.action == 'labeled' && (github.event.label.name == 'compatibility' || github.event.label.name == 'import-report')) ||
      (contains(github.event.issue.body, '### Test Result') && contains(github.event.issue.body, '### Device'))
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Parse and Import Compatibility Report
        id: import_step
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          python3 .github/scripts/import_compatibility_report.py

      - name: Notify Reporter on Naming Convention Validation Error
        if: steps.import_step.outputs.validation_error != ''
        uses: actions/github-script@v7
        env:
          VALIDATION_ERROR: ${{ steps.import_step.outputs.validation_error }}
        with:
          script: |
            const errMsg = process.env.VALIDATION_ERROR;
            if (!context.issue || !context.issue.number || !errMsg) return;

            const marker = "<!-- mcr-validation-notice -->";
            const body = `${marker}\n⚠️ **Action Needed — Device Naming Format**\n\n${errMsg}\n\nOnce you click **Edit** on your issue above and update **Other Device (Marketing Name & Codename)**, this workflow will automatically re-run and add your device to the [Per-Device Compatibility Table](https://github.com/vrwindsor1/Moto-Camera-Restored/blob/main/COMPATIBILITY.md)!`;

            try {
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number
              });
              const existing = comments.data.find(c => c.body && c.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body
                });
              }
            } catch (err) {
              console.log("Error posting validation comment:", err);
            }

      - name: Auto-update Issue Title with Device Name & Codename
        if: steps.import_step.outputs.validation_error == '' && steps.import_step.outputs.issue_title != ''
        uses: actions/github-script@v7
        env:
          NEW_TITLE: ${{ steps.import_step.outputs.issue_title }}
        with:
          script: |
            const newTitle = process.env.NEW_TITLE;
            if (newTitle && newTitle.trim().length > 0 && context.payload.issue.title !== newTitle) {
              try {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  title: newTitle
                });
                console.log(`Updated issue title to: ${newTitle}`);
              } catch (err) {
                console.log("Error updating issue title:", err);
              }
            }

      - name: Commit and Push Updated COMPATIBILITY.md, reports/, and Issue Template
        if: steps.import_step.outputs.validation_error == ''
        id: commit_step
        run: |
          git add -A COMPATIBILITY.md reports/ .github/ISSUE_TEMPLATE/compatibility_report.yml
          if git diff --cached --quiet; then
            echo "No changes detected in compatibility files."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected in compatibility files. Committing..."
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Auto-import compatibility report from #${{ github.event.issue.number }} [skip ci]"
            git pull --rebase origin main || true
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Add Comment, Labels, and Handle Issue Status
        if: steps.import_step.outputs.validation_error == '' && (steps.commit_step.outputs.changed == 'true' || steps.import_step.outputs.device_codename != '')
        uses: actions/github-script@v7
        env:
          IS_WORKING_PERFECTLY: ${{ steps.import_step.outputs.is_working_perfectly }}
          RESULT_CAT: ${{ steps.import_step.outputs.result_cat }}
        with:
          script: |
            const isWorkingPerfectly = process.env.IS_WORKING_PERFECTLY === 'true';
            const resultCat = process.env.RESULT_CAT || 'Tested';

            if (!context.issue || !context.issue.number) {
              console.log("No issue context found; skipping issue comment/update.");
              return;
            }

            // 1. Fetch comments to avoid duplicate bot confirmation comments on re-runs or edits
            let alreadyCommented = false;
            try {
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number
              });
              alreadyCommented = comments.data.some(
                c => c.user && c.user.login === 'github-actions[bot]' && c.body && c.body.includes('automatically processed and added')
              );
            } catch (err) {
              console.log("Error listing comments:", err);
            }

            if (!alreadyCommented) {
              let commentBody = `🎉 **Thank you!** Your compatibility report has been automatically processed and added to the [Per-Device Compatibility Table](https://github.com/vrwindsor1/Moto-Camera-Restored/blob/main/COMPATIBILITY.md).`;

              if (isWorkingPerfectly) {
                commentBody += `\n\n✅ **Outcome: Works Perfectly** — All camera features were reported as functional on this device. This issue has been automatically closed as completed.\n\n*If you encounter regressions in future ROM updates or have additional details to report, feel free to reopen this issue or submit a new report!*`;
              } else {
                commentBody += `\n\n📌 **Outcome: ${resultCat}** — This issue will remain open for community tracking and troubleshooting.`;
              }

              try {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: commentBody
                });
                console.log(`Created confirmation comment on issue #${context.issue.number}.`);
              } catch (err) {
                console.log("Error creating comment:", err);
              }
            } else {
              console.log("Bot comment already exists; skipping duplicate comment.");
            }

            // 2. Add labels (and verified label if working perfectly)
            try {
              const labelsToAdd = ["imported", "compatibility"];
              if (isWorkingPerfectly) {
                labelsToAdd.push("verified");
              }
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: labelsToAdd
              });
              console.log(`Applied labels [${labelsToAdd.join(", ")}] to issue #${context.issue.number}.`);
            } catch (err) {
              console.log("Error adding labels:", err);
            }

            // 3. Remove triage label if present
            try {
              await github.rest.issues.removeLabel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                name: "triage"
              });
              console.log(`Removed triage label from issue #${context.issue.number}.`);
            } catch (err) {
              // Ignore if label doesn't exist on issue
            }

            // 4. Automatically close the issue if reported as working perfectly
            if (isWorkingPerfectly) {
              const isClosed = context.payload.issue && context.payload.issue.state === 'closed';
              if (!isClosed) {
                try {
                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: context.issue.number,
                    state: 'closed',
                    state_reason: 'completed'
                  });
                  console.log(`Issue #${context.issue.number} automatically closed as completed.`);
                } catch (err) {
                  console.log("Error closing issue:", err);
                }
              } else {
                console.log(`Issue #${context.issue.number} is already closed.`);
              }
            }
