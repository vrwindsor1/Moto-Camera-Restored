name: "Import Compatibility Report"

on:
  issues:
    types: [opened, edited, labeled]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  import-report:
    # Trigger if title starts with [Compatibility] or instruction prefix, body contains report headers, or has compatibility/import-report label
    if: >-
      startsWith(github.event.issue.title, '[Compatibility]') ||
      startsWith(github.event.issue.title, 'Please DO NOT edit the title') ||
      contains(github.event.issue.labels.*.name, 'compatibility') ||
      (github.event.action == 'labeled' && (github.event.label.name == 'compatibility' || github.event.label.name == 'import-report')) ||
      (contains(github.event.issue.body, '### Compiler Method') && contains(github.event.issue.body, '### Device'))
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Parse and Import Compatibility Report
        id: import_step
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          python3 .github/scripts/import_compatibility_report.py

      - name: Auto-update Issue Title with Device Name & Codename
        if: steps.import_step.outputs.issue_title != ''
        uses: actions/github-script@v7
        env:
          NEW_TITLE: ${{ steps.import_step.outputs.issue_title }}
        with:
          script: |
            const newTitle = process.env.NEW_TITLE;
            if (newTitle && newTitle.trim().length > 0 && context.payload.issue.title !== newTitle) {
              try {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  title: newTitle
                });
                console.log(`Updated issue title to: ${newTitle}`);
              } catch (err) {
                console.log("Error updating issue title:", err);
              }
            }

      - name: Commit and Push Updated COMPATIBILITY.md and reports/
        id: commit_step
        run: |
          git add -A COMPATIBILITY.md reports/
          if git diff --cached --quiet; then
            echo "No changes detected in compatibility files."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changes detected in compatibility files. Committing..."
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "Auto-import compatibility report from #${{ github.event.issue.number }} [skip ci]"
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Add Comment and Labels to Issue
        if: steps.commit_step.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: "🎉 **Thank you!** Your compatibility report has been automatically processed and added to [COMPATIBILITY.md](https://github.com/vrwindsor1/Moto-Camera-Restored/blob/main/COMPATIBILITY.md)."
              });
            } catch (err) {
              console.log("Error creating comment:", err);
            }
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ["imported", "compatibility"]
              });
            } catch (err) {
              console.log("Error adding labels:", err);
            }
