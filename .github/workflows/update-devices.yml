name: Sync LineageOS Device Table

on:
  schedule:
    # Run every Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-devices:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout LineageOS Wiki
        uses: actions/checkout@v4
        with:
          repository: LineageOS/lineage_wiki
          path: lineage_wiki
          depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install pyyaml

      - name: Update Per-Device Compatibility Table
        run: |
          python scripts/update_compatibility.py --wiki-path lineage_wiki --output COMPATIBILITY.md

      - name: Clean up temporary wiki checkout
        run: rm -rf lineage_wiki

      - name: Commit & Push Changes
        run: |
          git add -A COMPATIBILITY.md reports/ .github/ISSUE_TEMPLATE/compatibility_report.yml
          if git diff --cached --quiet; then
            echo "No changes detected in compatibility files."
          else
            echo "Changes detected in compatibility files. Committing..."
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "chore(compatibility): auto-update per-device compatibility table [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
